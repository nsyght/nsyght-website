name: Release queued blog posts
# Each run first pulls any new BabyLoveGrowth articles into _queue (scripts/pull_blg.py),
# then publishes from the queue (scripts/release_posts.py).

on:
  schedule:
    # GitHub starts scheduled runs late or skips them when busy, so there are backups.
    # release_posts.py skips any run after the day's posts are out, so these never double-publish.
    # 13:07 UTC = 8:07am Central (CDT) / 7:07am (CST)
    - cron: '7 13 * * *'
    # backup: 9:37am CDT / 8:37am CST
    - cron: '37 14 * * *'
    # backup: 11:07am CDT / 10:07am CST
    - cron: '7 16 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many posts to publish now (blank = follow the queue rules)'
        required: false
        default: ''
      preview_pull:
        description: 'Preview only: list what would be pulled from BabyLoveGrowth, publish nothing (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-posts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull new BabyLoveGrowth articles into the queue
        # A BabyLoveGrowth outage should never stop the day's release.
        continue-on-error: true
        env:
          BLG_API_KEY: ${{ secrets.BLG_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.preview_pull }}" = "true" ]; then
            python3 scripts/pull_blg.py --dry-run
          else
            python3 scripts/pull_blg.py
          fi

      - name: Publish next posts
        if: github.event.inputs.preview_pull != 'true'
        run: |
          if [ -n "${{ github.event.inputs.count }}" ]; then
            python3 scripts/release_posts.py --force --count "${{ github.event.inputs.count }}"
          else
            python3 scripts/release_posts.py
          fi

      - name: Rebuild blog index, topic hubs, Keep Reading, and RSS
        if: github.event.inputs.preview_pull != 'true'
        run: python3 scripts/build_blog.py

      - name: Commit and push
        if: github.event.inputs.preview_pull != 'true'
        run: |
          git config user.name "nsyght-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish queued blog posts ($(TZ=America/Chicago date +%F))"
            git push
          fi
