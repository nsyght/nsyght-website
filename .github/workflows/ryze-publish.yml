name: Ryze publish
on:
  push:
    paths:
      - 'blog/data/**'
      - 'scripts/ryze-convert.mjs'
      - 'scripts/ryze-cover.mjs'
      - 'scripts/ryze-cover.test.mjs'
      - 'scripts/ryze-test.py'
      - '.github/workflows/ryze-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: ryze-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cover deduplication and preservation of illustrations
        run: node scripts/ryze-cover.test.mjs
      - name: Test full blog integration in an isolated copy
        run: python3 scripts/ryze-test.py
      - name: Validate and convert approved articles
        run: |
          mkdir -p blog/data
          node --check scripts/ryze-convert.mjs
          node scripts/ryze-convert.mjs
      - name: Verify generated pages and idempotence
        run: |
          git add blog _data/posts.json images/blog blog.html 'blog-category-*.html' feed.xml sitemap.xml
          git diff --cached --binary > /tmp/ryze-first.diff
          node scripts/ryze-convert.mjs
          git add blog _data/posts.json images/blog blog.html 'blog-category-*.html' feed.xml sitemap.xml
          git diff --cached --binary > /tmp/ryze-second.diff
          cmp /tmp/ryze-first.diff /tmp/ryze-second.diff
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { withoutRepeatedCover } from './scripts/ryze-cover.mjs';
          for (const name of fs.readdirSync('blog/data').filter(x => x.endsWith('.json'))) {
            const a = JSON.parse(fs.readFileSync('blog/data/'+name, 'utf8'));
            if (a.status !== 'published') continue;
            const page = fs.readFileSync('blog/'+a.slug+'/index.html','utf8');
            const image = page.match(/<meta property="og:image" content="https:\/\/nsyght.com([^"]+)"/);
            const body = image ? withoutRepeatedCover(a.body_html,[a.image?.url,image[1]]) : a.body_html;
            if (page.includes('[object Object]') || !page.includes(body) || !page.includes('https://nsyght.com/blog/'+a.slug) || !page.includes('<h1>') || !page.includes('<meta name="description"')) throw Error('Invalid generated page: '+a.slug);
            if (a.image && (!image || !fs.existsSync('.'+image[1]))) throw Error('Missing cover: '+a.slug);
          }
          JS
      - name: Commit generated output
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'nsyght-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render approved Ryze articles'
          git push origin HEAD:"$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
