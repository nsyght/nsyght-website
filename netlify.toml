# (scripts/release_posts.py adds a redirect here for each post it publishes)

# ── HIDE THE POST QUEUE AND BUILD SCRIPTS ──
[[redirects]]
  from = "/_queue/*"
  to = "/blog.html"
  status = 404
  force = true

[[redirects]]
  from = "/_data/*"
  to = "/blog.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/blog.html"
  status = 404
  force = true

